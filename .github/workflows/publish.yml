name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pin:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
      - run: aqua update-checksum --prune
      - run: aqua exec -- pinact run --check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  check-version-sync:
    needs: pin
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: bash scripts/check-version-sync.sh

  fmt:
    needs: pin
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    needs: pin
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --all-features -- -D warnings

  test:
    needs: pin
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --all-features

  publish-crate:
    needs: [check-version-sync, fmt, clippy, test]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  build:
    needs: [check-version-sync, fmt, clippy, test]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            pkg: darwin-arm64
            os: macos-latest
            use_cross: false
          - target: x86_64-apple-darwin
            pkg: darwin-x64
            os: macos-latest
            use_cross: false
          - target: x86_64-unknown-linux-musl
            pkg: linux-x64
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-musl
            pkg: linux-arm64
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            pkg: win32-x64
            os: windows-latest
            use_cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl-tools
        if: "matrix.os == 'ubuntu-latest' && !matrix.use_cross"
        run: sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked
      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}
      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.pkg }}
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/term-survivors.exe dist/${{ matrix.pkg }}/
          else
            cp target/${{ matrix.target }}/release/term-survivors dist/${{ matrix.pkg }}/
            chmod +x dist/${{ matrix.pkg }}/term-survivors
          fi
          cp npm/@term-survivors/${{ matrix.pkg }}/package.json dist/${{ matrix.pkg }}/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ matrix.pkg }}
          path: dist/${{ matrix.pkg }}/

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"
      - name: Download all binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
      - name: Set binary permissions
        run: |
          for pkg in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            chmod +x dist/npm-$pkg/term-survivors
          done
      - name: Publish platform packages
        run: |
          for pkg in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            npm publish ./dist/npm-$pkg --access public --provenance --tag latest
          done
      - name: Copy README to main package
        run: cp README.md npm/term-survivors/README.md
      - name: Publish main package
        run: npm publish ./npm/term-survivors --access public --provenance --tag latest

  upload-release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
      - name: Create and upload release archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          for pkg in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            tar czf term-survivors-${pkg}.tar.gz -C dist/npm-$pkg term-survivors
            sha256sum term-survivors-${pkg}.tar.gz > term-survivors-${pkg}.tar.gz.sha256
          done
          tar czf term-survivors-win32-x64.tar.gz -C dist/npm-win32-x64 term-survivors.exe
          sha256sum term-survivors-win32-x64.tar.gz > term-survivors-win32-x64.tar.gz.sha256
          gh release upload "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            term-survivors-*.tar.gz \
            term-survivors-*.sha256

  dispatch-homebrew-formula:
    if: github.event_name == 'release'
    needs: upload-release-assets
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Dispatch update-formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_DISPATCH_TOKEN }}
        run: |
          gh api repos/kimulaco/homebrew-term-survivors/dispatches \
            --method POST \
            --field event_type=new-release
